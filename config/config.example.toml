cost = "Input: $0.30 / 1M tokens; Output: $2.40 / 1M tokens"
backend = "vllm"
model_path = "Qwen/Qwen3.5-27B"
port = 8020
gpus = "1"

[llm.lang.qwen3-coder]
model = "Qwen/Qwen3-Coder-30B-A3B-Instruct"
