# Vision-capable language model candidates (PlanAgent selects one per vision agent)

[llm.vision.qwen3_5-27b]
model = "Qwen/Qwen3.5-27B"
base_url = "http://localhost:8020/v1"
api_key = "EMPTY"
max_tokens = 4096
