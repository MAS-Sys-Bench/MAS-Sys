[llm]
model = "claude-3-7-sonnet-20250219"
base_url = "YOUR_BASE_URL"
api_key = "YOUR_API_KEY"
max_tokens = 8192
temperature = 0.0

# PlanAgent's own LLM (used only by PlanAgent for planning and runtime coordination)
[llm.planner]
model = "claude-3-7-sonnet-20250219"
base_url = "YOUR_BASE_URL"
api_key = "YOUR_API_KEY"
max_tokens = 8192
temperature = 0.0

# Vision model candidates (PlanAgent selects one per agent)
# Each [llm.vision.<name>] defines a candidate LLM for vision agents.
# PlanAgent sees size/capabilities/cost and assigns the best fit.

[llm.vision]
model = "claude-3-7-sonnet-20250219"       # Default vision model used by benchmark-time image evaluation
base_url = "YOUR_BASE_URL" # API endpoint URL for the default vision evaluation model
api_key = "YOUR_API_KEY"                   # Your API key for the default vision evaluation model
max_tokens = 8192                          # Maximum number of tokens in the response
temperature = 0.0                          # Controls randomness for the default vision evaluation model
size = "unknown (cloud API)"
capabilities = "Default vision model used by benchmark-time image evaluation"
cost = "Cloud API pricing"

[llm.vision.claude-3-7-sonnet]
model = "claude-3-7-sonnet-20250219"       # The vision model to use
base_url = "YOUR_BASE_URL" # API endpoint URL for vision model
api_key = "YOUR_API_KEY"                   # Your API key for vision model
max_tokens = 8192                          # Maximum number of tokens in the response
temperature = 0.0                          # Controls randomness for vision model
size = "unknown (cloud API)"
capabilities = "Cloud-hosted large model with strong vision understanding, screenshot analysis, and multimodal reasoning"
cost = "Cloud API pricing"

# ── Language model candidates (PlanAgent selects one per agent) ────────────
# Each [llm.lang.<name>] defines a candidate LLM for text-based agents.
# PlanAgent sees size/capabilities/cost and assigns the best fit.

[llm.lang.qwen2_5-14b-Instruct]
model = "Qwen/Qwen2.5-14B-Instruct"
base_url = "http://localhost:8010/v1"
api_key = "EMPTY"
max_tokens = 4096
temperature = 0.0
size = "14B"
capabilities = "A efficient text model for general chat, coding/math assistance, structured data understanding, and multilingual tasks."
cost = "Input: $0.20 / 1M tokens; Output: $0.20 / 1M tokens"
backend = "vllm"
model_path = "Qwen/Qwen2.5-14B-Instruct"
port = 8010
gpus = "0"

[llm.lang.qwen3_5-27b]
model = "Qwen/Qwen3.5-27B"
base_url = "http://localhost:8020/v1"
api_key = "EMPTY"
