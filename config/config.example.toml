# Optional ORLA runtime configuration (benchmark-only runtime switch)
# Backend table keys should match planner-produced llm_config_name exactly.
# Example:
# [orla]
# url = "http://127.0.0.1:8081"
# timeout = 300.0
#
# [orla.backends."lang.qwen2_5-14b"]
# endpoint = "http://127.0.0.1:8001/v1"
# type = "openai"
# model_id = "openai:Qwen/Qwen2.5-14B-Instruct"
# max_concurrency = 8
# queue_capacity = 0
# quality = 0.75
#
# [orla.backends."lang.qwen2_5-14b".cost_model]
# input_cost_per_mtoken = 0.0
# output_cost_per_mtoken = 0.0
#
# Dry-run note:
# `--runtime orla_dry_run` only compiles MAS -> ORLA stages/segments and does not
# require any [orla] backend registration or reachable inference endpoints.

# Financial data API keys (used by DeepFundBench experiments)
[fund]
alpha_vantage_api_key = ""                 # Alpha Vantage API key (https://www.alphavantage.co/support/#api-key)
fred_api_key = ""                           # FRED API key (https://fred.stlouisfed.org/docs/api/api_key.html)

# Optional configuration for specific browser configuration
# [browser]
# Whether to run browser in headless mode (default: false)
#headless = false
# Disable browser security features (default: true)
#disable_security = true
# Extra arguments to pass to the browser
#extra_chromium_args = []
# Path to a Chrome instance to use to connect to your normal browser
# e.g. '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
#chrome_instance_path = ""
# Connect to a browser instance via WebSocket
#wss_url = ""
# Connect to a browser instance via CDP
#cdp_url = ""

# Optional configuration, Proxy settings for the browser
# [browser.proxy]
# server = "http://proxy-server:port"
# username = "proxy-username"
# password = "proxy-password"

# Optional configuration, Search settings.
# [search]
# Search engine for agent to use. Default is "Google", can be set to "Baidu" or "DuckDuckGo" or "Bing".
#engine = "Google"
# Fallback engine order. Default is ["DuckDuckGo", "Baidu", "Bing"] - will try in this order after primary engine fails.
#fallback_engines = ["DuckDuckGo", "Baidu", "Bing"]
# Seconds to wait before retrying all engines again when they all fail due to rate limits. Default is 60.
#retry_delay = 60
# Maximum number of times to retry all engines when all fail. Default is 3.
#max_retries = 3
# Language code for search results. Options: "en" (English), "zh" (Chinese), etc.
#lang = "en"
# Country code for search results. Options: "us" (United States), "cn" (China), etc.
#country = "us"


## Sandbox configuration
## When enabled, bash, python_execute, and str_replace_editor all run inside
## an isolated Docker container with resource limits.
## Requires Docker Desktop (Windows/macOS) or Docker Engine (Linux).
[sandbox]
use_sandbox = false            # Set to true to enable containerized tool execution
image = "python:3.12-slim"     # Docker image for the sandbox container
work_dir = "/workspace"        # Working directory inside the container
memory_limit = "512m"          # Container memory limit (e.g. "512m", "1g")
cpu_limit = 1.0                # CPU core limit
timeout = 300                  # Default command timeout in seconds
network_enabled = false        # Allow network access from sandbox (set true for SWE-bench)
